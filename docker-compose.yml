services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: divulga
      POSTGRES_PASSWORD: divulga123
      POSTGRES_DB: divulga_ai
    ports:
      # 5434 já é usado por outro projeto local (sx-empreende-db) → 5435
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divulga -d divulga_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgresql://divulga:divulga123@db:5432/divulga_ai
      DIRECT_URL: postgresql://divulga:divulga123@db:5432/divulga_ai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:4000
      FRONTEND_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_REDIRECT_URI: http://localhost:4000/api/v1/integrations/facebook/callback
      # Override NODE_ENV para development no compose local (o Dockerfile define production)
      NODE_ENV: development
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /docs (Swagger) responde 200 em qualquer método/estado da aplicação
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  uploads:
